services:
  # ====================================================================
  # MC 服务端：Forge 26.2 + MinePilot(mcai_companion) 无头常驻自主 bot
  #   - MinePilot 在服务端创建无账户 ServerPlayer，无需图形客户端/真人在线
  #   - 走服务端原生玩家路径，规避 mineflayer 的 PartialReadError / Illegal Move
  #   - Forge 必须锁 65.x：MinePilot 0.1.16 仅兼容 Forge 65.0.0 ~ 66.0.0(不含)
  #   - 镜像已镜像到 GHCR（见 .github/workflows/publish-ghcr.yml），国内拉取更稳
  # ====================================================================
  mc-server:
    image: ghcr.io/dc1024/minepilot-panel-mc-server:java25
    container_name: mc-server
    restart: unless-stopped
    depends_on:
      mod-sync:
        condition: service_completed_successfully
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      # MC/Forge 版本必须与 minepilot-build 构建的 mcai_companion 模组支持版本一致；
      # 上游同步后模组若升版，需同步改这两行（并改 minepilot-build/deploy-target.txt），否则模组加载失败。
      VERSION: "26.2"
      FORGE_VERSION: "65.0.0"
      MEMORY: "3G"
      # 打开 MinePilot 的诊断日志：-Dmcai.liveModelTest=true 会打印
      #   "Live-model decision rejected: kind=..., message=..."
      # 这是定位决策请求失败原因的唯一途径（ModelFailure 默认不落原始报文）。
      JVM_OPTS: "-Dmcai.liveModelTest=true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "<RCON_PASSWORD>"
      MOTD: "Zspace AI Minecraft Server"
      DIFFICULTY: "normal"
      TZ: "Asia/Shanghai"
      UID: "1000"
      GID: "1000"

      # ---- MinePilot：无头常驻配置 ----
      # 指向挂载的只读密钥文件（容器首选），避免密钥写进 toml/存档/日志
      MCAI_API_KEY_FILE: "/data/secrets/mcai-api-key"
      MCAI_MCP_TOKEN: "<MCP_TOKEN>"

    ports:
      - "25565:25565"
      - "25575:25575"
    volumes:
      - ./minecraft-data:/data
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      start_period: 420s
      retries: 10

  # ====================================================================
  # 旧 P3 路线A（Mindcraft + mineflayer）：已退役
  #   - mineflayer/minecraft-data 不支持 MC 26.x，且存在未修的协议解析缺陷
  #   - 保留定义以便回退，加 profile 后默认不随 up 启动
  #   - 需要时：docker compose --profile legacy-mindcraft up -d ai-agent
  # ====================================================================
  ai-agent:
    profiles: ["legacy-mindcraft"]
    build: ./ai-agent
    container_name: ai-agent
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./ai-agent-data:/data
    environment:
      MC_HOST: "mc-server"
      MC_PORT: "25565"
      MC_USERNAME: "AIBot"
      MC_VERSION: "1.21.1"
      MC_AUTH: "offline"
      WEB_PORT: "3002"
      MINDSERVER_URL: "http://127.0.0.1:8080"
      ALLOW_ACTIONS: "false"
      TZ: "Asia/Shanghai"
      LOG_LEVEL: "info"

  # ====================================================================
  # MinePilot 配置面板（网页版）
  #   - 改 config/mcai-companion.toml（模型/MCP/白名单/皮肤）+ API Key
  #   - 看状态/在线玩家/日志，一键「停止 → 写盘 → 启动」
  #   - 镜像已发布到 GHCR（ghcr.io/dc1024/minepilot-panel:latest），内置 server.js 启动命令
  #   - 挂 docker.sock 仅用于 stop/start/inspect/logs（代码里只对 mc-server 操作）
  # ====================================================================
  mcai-panel:
    image: ghcr.io/dc1024/minepilot-panel:latest
    container_name: mcai-panel
    restart: unless-stopped
    ports:
      - "25800:25800"
    volumes:
      - ./minecraft-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PANEL_PORT: "25800"
      PANEL_TOKEN: "<PANEL_TOKEN>"
      MC_CONTAINER: "mc-server"
      MC_DATA_DIR: "/data"
      MC_RCON_HOST: "mc-server"
      MC_RCON_PORT: "25575"
      MC_RCON_PASSWORD: "<RCON_PASSWORD>"
      MC_UID: "1000"
      MC_GID: "1000"
      TZ: "Asia/Shanghai"
    # command 已内置在镜像中，无需再挂源码或指定 command


  # ====================================================================
  # 模组同步：从 minepilot-build 的 GitHub Release 拉取最新 mcai_companion.jar
  #   - minepilot-build 每次 push main（含每月上游同步后重建）都会更新该 Release
  #   - mc-server depends_on 本服务，确保启动前 mod 已就位；拉取失败则不启动服务端
  #   - 仓库为公开，免 token 直拉；若设为私有，请在 environment 注入 GITHUB_TOKEN
  #     并在 command 的 curl 上加 -H "Authorization: Bearer $GITHUB_TOKEN"
  # ====================================================================
  mod-sync:
    image: curlimages/curl:latest
    container_name: mod-sync
    restart: "no"
    volumes:
      - ./minecraft-data:/data
    environment:
      MOD_URL: "https://github.com/DC1024/minepilot-build/releases/download/mcai-companion-latest/mcai_companion.jar"
    command:
      - sh
      - -c
      - "mkdir -p /data/mods && curl -fSL -o /data/mods/mcai_companion.jar $$MOD_URL && echo 'mod jar synced'"

networks:
  default:
    name: minecraft_default
